name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: pytest -q

  hunter:
    name: Job Hunter (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: hunter/pyproject.toml
      # Sin el extra "scrape": los tests usan fuentes falsas y nunca importan jobspy.
      - run: pip install -e ../backend -e ".[dev]"
      - name: Lint
        run: ruff check hunter tests
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck + build
        run: npm run build
