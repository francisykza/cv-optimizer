[project]
name = "cv-optimizer-hunter"
version = "0.1.0"
description = "Job Hunter: buscador y filtrador inverso de empleo con IA (ver SPEC.md)"
requires-python = ">=3.12"
# Además necesita el backend instalado como paquete: pip install -e ../backend
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Scraping de LinkedIn, Indeed y Google Jobs. Opcional: los tests y la CI no lo necesitan.
scrape = ["python-jobspy==1.3.0"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hunter*"]

[tool.setuptools.package-data]
"hunter.store" = ["migrations/*.sql"]
hunter = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: llama a Groq de verdad (HUNTER_LIVE=1); fuera de CI"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
